<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <style>

            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: bold;
            border-bottom: 1px solid #30363d;

        .status-box {

<div class="card">

    <p style="font-size: 13px; color: #8b949e; line-height: 1.6;">
        1. قم بتثبيت بايثون ومكتبة Playwright على جهازك.<br>
        2. شغل ملف السكريبت المحلي (script.py) لتبدأ منصة كيريو والثقافة المالية بالحل التلقائي لحسابك.
    </p>
</div>

</html>
